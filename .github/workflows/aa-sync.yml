name: Refresh field data

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull the Artificial Analysis feed (public page, no key)
        run: python scripts/sync_aa_public.py

      - name: Reasoning column (GPQA-Diamond per model)
        run: python scripts/sync_reasoning.py

      - name: Merge the keyed feed into the curated list (no new models)
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: python scripts/sync_aa.py

      - name: Pull the coding history feed
        env:
          ASL_DATA_KEY: ${{ secrets.AISTUPIDLEVEL_KEY }}
        run: python scripts/sync_coding.py

      - name: Commit the refreshed data
        run: |
          git config user.name "oroboros-aa-sync"
          git config user.email "sync@oroboros.ai"
          git add field_data.json aa_cache.json coding_history.json
          git diff --staged --quiet || git commit -m "data: refresh field feed"
          git push
